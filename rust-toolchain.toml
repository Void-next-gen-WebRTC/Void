[toolchain]
# Pinned so `cargo clippy`/`fmt`/`test` behave identically for every
# contributor regardless of when they installed Rust — rustup reads this
# file automatically and installs/uses this exact version (no manual
# `rustup install` step needed, it's transparent on first `cargo` invocation
# in this repo).
#
# New clippy lints land on every stable release; without a pin, a
# contributor on a newer toolchain than the one CI/other contributors use
# can see `cargo lint` fail (or pass) differently than everyone else for
# reasons that have nothing to do with their actual change. Bump this
# deliberately, in its own PR, when upgrading.
channel = "1.97.0"
components = ["clippy", "rustfmt"]
# This file is an *override* — rustup uses it (and only it) for every
# `cargo`/`rustc` invocation inside this repo, ignoring whatever `targets`
# a CI step configured for the generic "stable" toolchain (dtolnay/rust-
# toolchain's `targets:`/`rust-targets:` inputs get silently discarded).
# Every cross-compile target used anywhere in CI must be listed here, or
# that specific job fails with "error[E0463]: can't find crate for `std`"
# / "Target ... is not installed" despite the workflow explicitly asking
# for it.
#   - aarch64-unknown-linux-gnu: signaling-server cross-compiled for the
#     Oracle Ampere (ARM64) VM (deploy-signaling.yml).
#   - aarch64-apple-darwin / x86_64-apple-darwin: Tauri's
#     `--target universal-apple-darwin` lipo's both into one binary
#     (release.yml). aarch64 alone isn't enough even on Apple Silicon
#     runners — the x86_64 half still needs to be explicit here.
targets = [
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
