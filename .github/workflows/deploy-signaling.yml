#
# Deploy pipeline: cross-compile ARM64 binary on GitHub runner → push image to GHCR
#                  → SSH to Oracle VM → kubectl apply deployment-k3s.yaml
#
# Same approach as the old docker-compose deploy: build on GitHub servers, push image,
# then SSH to the VM to apply. No self-hosted runner needed.
#
# Required GitHub secrets (same as before + DOMAIN + GHCR_TOKEN):
#   PRIMARY_PIN_HASH     — build-time Rust env var (baked into binary)
#   BACKUP_PIN_HASH      — build-time Rust env var (baked into binary)
#   ORACLE_HOST          — Oracle VM public IP
#   ORACLE_SSH_KEY       — SSH private key for ubuntu@ORACLE_HOST
#   DOMAIN               — public domain (api.voidsfu.com) for envsubst
#   SLACK_WEBHOOK_URL    — Slack notifications
#   GHCR_TOKEN           — GitHub PAT with read:packages (for k3s image pull)
#                          Create at: GitHub → Settings → Developer settings → Tokens
#                          Permissions: Packages: read — no expiry recommended
#
# One-time cluster bootstrap (run manually once on the VM):
#   See deployment-k3s.yaml pre-flight checklist for kubectl create secret commands.

name: Deploy Signaling Server + Monitoring

on:
  push:
    branches:
      - main
    paths:
      - 'packages/signaling-server/**'
      - 'packages/void-sfu/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-signaling.yml'
      - 'Dockerfile'
      - 'deployment-k3s.yaml'
      - 'docker/**'
  workflow_dispatch:

env:
  RUST_TOOLCHAIN: stable
  TARGET_PLATFORM: aarch64-unknown-linux-gnu
  # IMAGE is set to lowercase in the first build step (GHCR requires all-lowercase names).
  # github.repository_owner may contain uppercase (e.g. Void-next-gen-WebRTC) which
  # would make docker/build-push-action fail with "repository name must be lowercase".

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Run the test suite before any build or deploy step.
  # ─────────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    env:
      PRIMARY_PIN_HASH: ${{ secrets.PRIMARY_PIN_HASH }}
      BACKUP_PIN_HASH: ${{ secrets.BACKUP_PIN_HASH }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run void-sfu tests
        run: cargo test -p void-sfu --verbose

      - name: Run signaling-server tests
        run: cargo test -p signaling-server --verbose

  # ─────────────────────────────────────────────────────────────────────────
  # Cross-compile ARM64 binary on GitHub runner → build Docker image → push
  # to GHCR → SSH to Oracle VM → kubectl apply (same flow as old docker-compose)
  # ─────────────────────────────────────────────────────────────────────────
  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to GitHub Container Registry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GHCR requires all-lowercase image names. github.repository_owner preserves
      # original casing (e.g. Void-next-gen-WebRTC) so we normalise it here and
      # expose IMAGE as a job-level env var for all subsequent steps.
      - name: Set lowercase image name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${OWNER}/void-signaling-server" >> $GITHUB_ENV

      - name: Install Rust toolchain (ARM64 cross-compilation)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.TARGET_PLATFORM }}

      - name: Install ARM64 cross-linker + envsubst
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gettext-base

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build binary (linux/aarch64)
        env:
          PRIMARY_PIN_HASH: ${{ secrets.PRIMARY_PIN_HASH }}
          BACKUP_PIN_HASH: ${{ secrets.BACKUP_PIN_HASH }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ env.TARGET_PLATFORM }} -p signaling-server

      # Copy to repo root so the Dockerfile COPY instruction resolves correctly
      - name: Stage binary for Docker build context
        run: cp target/${{ env.TARGET_PLATFORM }}/release/signaling-server signaling-server

      # QEMU is required to build linux/arm64 images on the x86 GitHub-hosted runner
      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          # SHA tag = immutable reference pinned in the manifest; latest = rolling alias
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            PRIMARY_PIN_HASH=${{ secrets.PRIMARY_PIN_HASH }}
            BACKUP_PIN_HASH=${{ secrets.BACKUP_PIN_HASH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Render the manifest locally (safe: restricted to DOMAIN + SIGNALING_IMAGE only)
      # then push it to the VM and apply via kubectl — same SSH pattern as old docker-compose deploy.
      - name: Render k3s manifest with envsubst
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          SIGNALING_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
        run: |
          envsubst '$DOMAIN,$SIGNALING_IMAGE' < deployment-k3s.yaml > deployment-k3s-rendered.yaml

      - name: Copy rendered manifest to Oracle VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "deployment-k3s-rendered.yaml,docker/"
          target: "/home/ubuntu/void"

      - name: Deploy on Oracle VM via kubectl
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: GHCR_ACTOR,GHCR_TOKEN
          script: |
            echo "=== Applying k3s manifest ==="
            cd ~/void

            # Refresh GHCR pull secret so k3s can pull the private image.
            # Uses a long-lived PAT (GHCR_TOKEN) instead of the ephemeral GITHUB_TOKEN.
            kubectl create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username="${GHCR_ACTOR}" \
              --docker-password="${GHCR_TOKEN}" \
              -n void \
              --dry-run=client -o yaml | kubectl apply -f -

            # Sync Grafana dashboard ConfigMap (idempotent)
            kubectl create configmap grafana-dashboards-json \
              --from-file=sfu-dashboard.json=docker/grafana/provisioning/dashboards/sfu-dashboard.json \
              -n void --dry-run=client -o yaml | kubectl apply -f -

            # Apply the rendered manifest
            kubectl apply -f deployment-k3s-rendered.yaml

            echo "=== Waiting for signaling-server rollout ==="
            kubectl rollout status daemonset/signaling-server -n void --timeout=120s

            echo "=== Waiting for monitoring stack ==="
            kubectl rollout status deployment/prometheus   -n void --timeout=90s
            kubectl rollout status deployment/grafana      -n void --timeout=90s
            kubectl rollout status deployment/alertmanager -n void --timeout=90s

            echo "=== Health checks ==="
            curl -f --max-time 10 http://localhost:3001/health && echo "✅ Signaling OK" || { echo "❌ Signaling FAILED"; exit 1; }

            kubectl image prune -a --force 2>/dev/null || true
            echo "🚀 Déploiement k3s terminé avec succès !"

  # ─────────────────────────────────────────────────────────────────────────
  # Slack notification regardless of success or failure.
  # ─────────────────────────────────────────────────────────────────────────
  notify:
    needs: build-and-deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: "Déploiement SFU k3s: ${{ job.status }} — ${{ github.event.head_commit.message }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

