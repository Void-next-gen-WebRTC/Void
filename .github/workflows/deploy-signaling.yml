#
# Deploy pipeline: native ARM64 build on self-hosted runner → push to GHCR → kubectl apply
#
# Required GitHub secrets:
#   PRIMARY_PIN_HASH     — build-time Rust env var (baked into the binary at compile time)
#   BACKUP_PIN_HASH      — build-time Rust env var (baked into the binary at compile time)
#   DOMAIN               — public domain used for envsubst in deployment-k3s.yaml
#   SLACK_WEBHOOK_URL    — Slack notifications
#
# Self-hosted runner setup (one-time, on the Oracle ARM64 VM):
#   Go to: GitHub → Settings → Actions → Runners → New self-hosted runner
#   Select: Linux / ARM64 — follow the instructions on the VM
#   The runner must have: docker, kubectl, cargo, rustup, gettext-base (envsubst)
#   Install dependencies:  sudo apt-get install -y gettext-base
#                          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh
#
# No KUBE_CONFIG secret needed: kubectl uses /etc/rancher/k3s/k3s.yaml on the VM directly.
# No QEMU, no cross-compilation, no ARM64 linker — builds run natively on aarch64.
#
# One-time cluster bootstrap (run manually once on the VM):
#   See deployment-k3s.yaml pre-flight checklist for kubectl create secret commands.

name: Deploy Signaling Server + Monitoring

on:
  push:
    branches:
      - main
    paths:
      - 'packages/signaling-server/**'
      - 'packages/void-sfu/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-signaling.yml'
      - 'Dockerfile'
      - 'deployment-k3s.yaml'
      - 'docker/**'
  workflow_dispatch:

env:
  RUST_TOOLCHAIN: stable
  # GHCR image — repository_owner works for personal accounts and orgs alike
  IMAGE: ghcr.io/${{ github.repository_owner }}/void-signaling-server

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Run the test suite on a standard runner before any deploy step.
  # Kept on ubuntu-latest (x86) since unit tests don't require ARM64 hardware.
  # ─────────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    env:
      PRIMARY_PIN_HASH: ${{ secrets.PRIMARY_PIN_HASH }}
      BACKUP_PIN_HASH: ${{ secrets.BACKUP_PIN_HASH }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run void-sfu tests
        run: cargo test -p void-sfu --verbose

      - name: Run signaling-server tests
        run: cargo test -p signaling-server --verbose

  # ─────────────────────────────────────────────────────────────────────────
  # Build on the Oracle ARM64 VM (self-hosted runner).
  # Native compilation — no QEMU, no cross-linker, no TARGET_PLATFORM override.
  # Docker builds natively for linux/arm64 without emulation.
  # kubectl uses the local k3s kubeconfig already present on the VM.
  # ─────────────────────────────────────────────────────────────────────────
  build-and-deploy:
    needs: test
    runs-on: [self-hosted, linux, arm64]
    permissions:
      contents: read
      packages: write   # required to push to GitHub Container Registry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (native aarch64)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: aarch64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            aarch64-cargo-

      # Native build — no --target flag, no cross-linker env var needed
      - name: Build binary (native aarch64)
        env:
          PRIMARY_PIN_HASH: ${{ secrets.PRIMARY_PIN_HASH }}
          BACKUP_PIN_HASH: ${{ secrets.BACKUP_PIN_HASH }}
        run: cargo build --release -p signaling-server

      # Copy to repo root so the Dockerfile COPY instruction resolves correctly
      - name: Stage binary for Docker build context
        run: cp target/release/signaling-server signaling-server

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Native arm64 build — no QEMU, no Buildx platform flag required
      - name: Build and push Docker image (native linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # SHA tag = immutable reference pinned in the manifest; latest = rolling alias
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            PRIMARY_PIN_HASH=${{ secrets.PRIMARY_PIN_HASH }}
            BACKUP_PIN_HASH=${{ secrets.BACKUP_PIN_HASH }}

      # k3s kubeconfig is already present on the VM — no KUBE_CONFIG secret needed
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          sudo cat /etc/rancher/k3s/k3s.yaml > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Ensure namespace exists
        run: kubectl get namespace void 2>/dev/null || kubectl create namespace void

      # Grafana dashboard JSON is managed outside the main manifest (too large to inline).
      # --dry-run=client + apply makes this step fully idempotent.
      - name: Sync Grafana dashboard ConfigMap
        run: |
          kubectl create configmap grafana-dashboards-json \
            --from-file=sfu-dashboard.json=docker/grafana/provisioning/dashboards/sfu-dashboard.json \
            -n void --dry-run=client -o yaml | kubectl apply -f -

      - name: Render manifest with envsubst and apply
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          # Pin to the exact commit SHA so every rollout is fully traceable
          SIGNALING_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
        run: |
          # Restrict substitution to DOMAIN and SIGNALING_IMAGE only.
          # Without the explicit list, envsubst would erase Prometheus alert
          # template vars ({{ $value }}) and Grafana URL patterns (%(protocol)s)
          # that also look like shell variables, corrupting the rendered config.
          envsubst '$DOMAIN,$SIGNALING_IMAGE' < deployment-k3s.yaml | kubectl apply -f -

      - name: Wait for signaling-server rollout
        run: kubectl rollout status daemonset/signaling-server -n void --timeout=120s

      - name: Wait for monitoring stack
        run: |
          kubectl rollout status deployment/prometheus   -n void --timeout=90s
          kubectl rollout status deployment/grafana      -n void --timeout=90s
          kubectl rollout status deployment/alertmanager -n void --timeout=90s

      - name: Health checks
        run: |
          kubectl wait --for=condition=Ready pod -l app=signaling-server -n void --timeout=60s
          kubectl wait --for=condition=Ready pod -l app=prometheus        -n void --timeout=60s
          kubectl wait --for=condition=Ready pod -l app=grafana           -n void --timeout=60s
          echo "🚀 Deployment successful — ${{ env.IMAGE }}:${{ github.sha }}"

      # Keep last 5 untagged digests in GHCR to avoid storage bloat
      - name: Prune old GHCR images
        uses: actions/delete-package-versions@v5
        with:
          package-name: void-signaling-server
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: true
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────
  # Slack notification regardless of success or failure.
  # ─────────────────────────────────────────────────────────────────────────
  notify:
    needs: build-and-deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: "Déploiement SFU k3s: ${{ job.status }} — ${{ github.event.head_commit.message }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}