name: CLA Verification

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA and agree to its terms') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/Void-next-gen-WebRTC/Void/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: dependabot*,renovate*,bot*
          create-file-commit-message: 'docs: CLA signed'
          signed-commit-message: 'CLA has been signed'
          custom-notsigned-prcomment: |
            Thank you for contributing to Void! 💜

            Before your PR can be merged, we need you to sign our **[Contributor License Agreement (CLA)](https://github.com/Void-next-gen-WebRTC/Void/blob/main/CLA.md)**.

            ✅ **How to sign:**
            1. Review the CLA at [CLA.md](https://github.com/Void-next-gen-WebRTC/Void/blob/main/CLA.md)
            2. Reply to this comment with exactly: **I have read the CLA and agree to its terms**
            3. CLA Assistant will verify and update this status automatically

            This is a one-time requirement. Thank you!
          custom-pr-sign-comment: 'I have read the CLA and agree to its terms'
          custom-allsigned-prcomment: '✅ All contributors have signed the CLA. This PR is ready for review.'