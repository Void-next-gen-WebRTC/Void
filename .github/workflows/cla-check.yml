name: CLA Verification

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  cla-check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get PR author
        id: pr-author
        run: |
          AUTHOR=$(jq -r '.pull_request.user.login' < "$GITHUB_EVENT_PATH")
          echo "author=$AUTHOR" >> $GITHUB_OUTPUT

      - name: Check if PR author is bot
        id: is-bot
        run: |
          AUTHOR=${{ steps.pr-author.outputs.author }}
          if [[ "$AUTHOR" == "dependabot"* ]] || [[ "$AUTHOR" == "renovate" ]]; then
            echo "is_bot=true" >> $GITHUB_OUTPUT
          else
            echo "is_bot=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip CLA for bots
        if: steps.is-bot.outputs.is_bot == 'true'
        run: |
          echo "✅ Skipping CLA check for bot: ${{ steps.pr-author.outputs.author }}"

      - name: CLA Assistant Check (if not bot)
        if: steps.is-bot.outputs.is_bot == 'false'
        uses: contributor-assistant/github-action@v2.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'CLA.md'
          branch: 'main'
          allowlist: dependabot,renovate,bot
          remote-organization-name: Void-next-gen-WebRTC
          remote-repository-name: Void
          create-file-commit-message: 'docs: CLA signed'
          signed-commit-message: 'CLA has been signed'
          custom-notsigned-prcomment: |
            Thank you for contributing to Void! 💜

            Before your PR can be merged, we need you to sign our **[Contributor License Agreement (CLA)](../CLA.md)**.

            ✅ **How to sign:**
            1. Review the CLA at [CLA.md](../CLA.md)
            2. Reply to this comment with: **I have read the CLA and agree to its terms**
            3. CLA Assistant will verify and update this status

            This is a one-time requirement. Thank you!
          custom-pr-sign-comment: '✅ CLA signed! Thank you for your contribution to Void! 💜'
          custom-allsigned-prcomment: '✅ All contributors have signed the CLA. This PR is ready for review.'
          custom-signaturefile-label: 'CLA signatures'
          custom-reponame: 'Void'
          custom-maxcomments: 10

  verify-status:
    runs-on: ubuntu-latest
    needs: cla-check
    if: always()
    steps:
      - name: Report status
        run: |
          if [[ "${{ needs.cla-check.result }}" == "success" ]]; then
            echo "✅ CLA verification passed"
          else
            echo "⚠️ CLA verification check status: ${{ needs.cla-check.result }}"
          fi