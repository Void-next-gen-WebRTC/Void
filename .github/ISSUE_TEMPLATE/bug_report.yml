name: 🐛 Bug Report
description: Report a bug or unexpected behavior in Void
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in Void! Please fill out the sections below as completely as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the issue.
    validations:
      required: true

  - type: textarea
    id: current-behavior
    attributes:
      label: Current Behavior
      description: What currently happens?
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true

  - type: input
    id: void-version
    attributes:
      label: Void Version
      description: Tag or commit hash
    validations:
      required: true

  - type: input
    id: rust-version
    attributes:
      label: Rust Version
      description: Output of `rustc --version`
    validations:
      required: false

  - type: input
    id: node-version
    attributes:
      label: Node.js / pnpm Version
      description: Output of `node --version` / `pnpm --version`
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Screenshots / Logs
      description: Attach screenshots, error messages, or log output if helpful.
      render: shell
    validations:
      required: false

  - type: input
    id: related-issues
    attributes:
      label: Related Issues / PRs
      placeholder: "Relates to #12, Fixes #34"
    validations:
      required: false

  - type: textarea
    id: possible-solution
    attributes:
      label: Possible Solution
      description: Suggest a solution if you have one (optional).
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to avoid creating a duplicate
          required: true
        - label: I have verified this bug still occurs on the latest `main`
          required: true
