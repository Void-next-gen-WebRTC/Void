name: 💡 Feature Request
description: Suggest a new feature or enhancement for Void
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an idea for Void! Please describe it as clearly as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the feature or enhancement you'd like to see.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this solve? Why is it needed?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe how you imagine this working (optional).
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false

  - type: input
    id: related-issues
    attributes:
      label: Related Issues / PRs
      placeholder: "Relates to #12"
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to avoid creating a duplicate
          required: true
