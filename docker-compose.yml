services:
  signaling-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PRIMARY_PIN_HASH: ${PRIMARY_PIN_HASH}
        BACKUP_PIN_HASH: ${BACKUP_PIN_HASH}
    image: signaling-server
    container_name: signaling-live
    network_mode: "host"
    privileged: true
    restart: always
    volumes:
      - /home/ubuntu/secrets/primary.pem:/app/cert.pem:ro
      - /home/ubuntu/secrets/primary.key:/app/key.pem:ro
      - signaling_data:/app
    environment:
      - RUST_LOG=info
      - JWT_SECRET=${JWT_SECRET}
      - PUBLIC_IP=${PUBLIC_IP}
      # Fixed UDP port for the ICE UDPMux. A single socket on 0.0.0.0 prevents
      # sockets from being allocated on Docker bridge IPs (172.17.x.x) which
      # are unreachable via Oracle Cloud 1:1 NAT and would cause ICE failure
      # for peers behind Docker Desktop / WSL2 on Windows.
      - ICE_UDP_PORT=${ICE_UDP_PORT:-10000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    network_mode: "host"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.external-url=https://${DOMAIN}/prometheus/'
      - '--web.route-prefix=/'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_PROVISIONING_ENABLED=true
      - GF_SERVER_DOMAIN=${DOMAIN}
      - GF_SERVER_ROOT_URL=https://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager
    network_mode: "host"
    volumes:
      - ./docker/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=https://${DOMAIN}/alertmanager/'
      - '--web.route-prefix=/'
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    network_mode: "host"
    restart: unless-stopped

volumes:
  signaling_data:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local
  alertmanager_data:
    driver: local